name: jospar
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.9+27

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter
  # Локализация
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  shared_preferences: ^2.3.3
  package_info_plus: ^9.0.1
  flutter_secure_storage: ^9.2.4
  dio: ^5.8.0+1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0

  # UI
  cupertino_icons: ^1.0.8
  table_calendar: ^3.1.3
  flutter_animate: ^4.5.2
  flutter_slider_drawer: ^3.0.2
  flutter_slidable: ^4.0.0
  flutter_svg: ^2.0.0
  animated_toggle_switch: ^0.8.5
  pin_code_fields: ^8.0.1
  share_plus: ^11.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^7.0.0
  drift: ^2.22.0
  drift_flutter: ^0.2.8
  synchronized: ^3.1.0

  # Сеть
  http: ^1.4.0
  pretty_http_logger: ^1.0.4
  pusher_reverb_flutter: ^0.0.9

  # Система
  # State management
  provider: ^6.1.2
  uuid: ^4.5.1
  app_settings: ^6.1.1
  go_router: ^16.2.2
  app_links: ^7.2.1
  upgrader: ^13.6.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  drift_dev: ^2.22.0
  build_runner: ^2.4.13

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/Jospar.jpg"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/
    - assets/icons/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Bold.ttf
          weight: 700
